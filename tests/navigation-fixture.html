<script src="../package/wp-content/themes/nexor/assets/nexor.js"></script>
<script>addEventListener('load',()=>setTimeout(()=>{const service=[...document.querySelectorAll('header button')].find(b=>b.textContent.trim()==='Услуги'),mobile=document.querySelector('header .lucide-menu').closest('button');service.click();const mega=document.querySelector('.nexor-mega'),desktopOpen=!mega.hidden&&service.getAttribute('aria-expanded')==='true';mega.querySelector('a').focus();mega.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));const desktopEscape=mega.hidden&&document.activeElement===service;mobile.click();const panel=document.querySelector('.nexor-mobile-menu'),mobileOpen=!panel.hidden&&document.activeElement===panel.querySelector('.nexor-mobile-menu__close');document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));const mobileEscape=panel.hidden&&document.activeElement===mobile;document.querySelector('[data-nexor-context-id="extra-1"]').click();const contextField=document.querySelector('.nexor-modal [name="additional_service_id"]')?.value==='extra-1';const result={desktopOpen,desktopEscape,mobileOpen,mobileEscape,contextField,searchForms:document.querySelectorAll('.nexor-search').length,desktopLinks:[...service.closest('nav[aria-label="Main"]').parentElement.querySelectorAll(':scope > a')].map(a=>a.textContent),ghostSections:[...document.querySelectorAll('a')].some(a=>['/#prices','/#additional-services','/#promotions'].includes(new URL(a.href).hash?`${new URL(a.href).pathname}${new URL(a.href).hash}`:''))};document.body.innerHTML=`<pre id="result">${JSON.stringify(result)}</pre>`;},50));</script>
