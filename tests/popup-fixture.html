<!doctype html><html><body><button id="origin">Начало</button><div class="nexor-modal" hidden></div>
<script>window.matchMedia=()=>({matches:true});Storage.prototype.setItem=function(){throw new Error('blocked')};window.NexorSettings={enhancements:{exitIntent:{enabled:1,heading:'Заголовок',body:'Текст',offer_text:'Условия',cta_label:'CTA',minimum_delay_seconds:5,suppression_days:7,storage_version:'test'}}};</script>
<script src="../package/wp-content/themes/nexor/assets/nexor.js"></script>
<script>addEventListener('load',()=>{const origin=document.querySelector('#origin');origin.focus();setTimeout(()=>{window.immediateNegative=document.querySelector('.nexor-exit')?.hidden===true;},100);setTimeout(()=>{document.querySelector('.nexor-modal').hidden=false;},4800);setTimeout(()=>{const conflict=document.querySelector('.nexor-modal');window.conflictNegative=document.querySelector('.nexor-exit')?.hidden===true;conflict.hidden=true;},5200);setTimeout(()=>{const dialog=document.querySelector('.nexor-exit');window.opened=dialog&&!dialog.hidden;dialog.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true,cancelable:true}));window.escapeClosed=dialog.hidden&&document.activeElement===origin;document.dispatchEvent(new CustomEvent('nexor:lead-success'));const cookieFallback=document.cookie.includes('nexor_exit_test=lead');document.body.innerHTML=`<pre id="result">${JSON.stringify({immediateNegative,conflictNegative,opened,escapeClosed,cookieFallback})}</pre>`;},6300);});</script>
</body></html>
